# Additions for development, layered over AVideo's own docker-compose.yml (see dev/README.md).
#
#   docker compose -f <AVideo>/docker-compose.yml -f <this file> up -d ...
#
# Relative paths resolve from the first compose file, so the path of
# this repository comes in LOGINOIDC_REPO.
services:
  avideo:
    volumes:
      - "${LOGINOIDC_REPO:?set LOGINOIDC_REPO}/LoginOIDC:/var/www/html/AVideo/plugin/LoginOIDC"
      # The whole repository is visible too, to run the tests with AVideo's own PHP.
      - "${LOGINOIDC_REPO}:/opt/loginoidc:ro"
    # Keycloak shares the network of avideo, so its published port is declared here.
    ports:
      - "${KEYCLOAK_PORT:-8081}:${KEYCLOAK_PORT:-8081}"

  # The database is pinned to a MariaDB LTS. Upstream builds Dockerfile.mariadb from
  # mariadb:latest (a short-term release), so the version could change with every rebuild.
  # The build is dropped, the image is named directly, and upstream's configuration file is mounted.
  #
  # The data lives outside the AVideo tree, in a named volume. Upstream keeps it in
  # ./.compose/db, but the entrypoint of avideo chowns the whole AVideo tree to
  # www-data on start. That changes the owner of the database files as well, and
  # MariaDB can no longer read its own data (error 1018).
  database:
    image: "mariadb:${MARIADB_VERSION:-12.3}"
    build: !reset null
    volumes:
      - avideo_db:/var/lib/mysql
      - ./deploy/my.cnf:/etc/mysql/my.cnf:ro

  database_encoder:
    image: "mariadb:${MARIADB_VERSION:-12.3}"
    build: !reset null
    volumes:
      - avideo_db_encoder:/var/lib/mysql
      - ./deploy/my.cnf:/etc/mysql/my.cnf:ro

  # Keycloak's data is not persisted. Recreating the container imports the realm
  # again, so tests always start from the same state. The user IDs (= sub) are
  # fixed in the realm definition and survive a recreation.
  #
  # It shares the network of avideo (network_mode). The issuer URL has to be
  # reachable under the same name from the browser and from the avideo container.
  # The entrypoint of avideo points its own host name at 127.0.0.1, so a Keycloak
  # in another container cannot be reached under that name. On a shared network
  # avideo reaches Keycloak at 127.0.0.1:8081 and Keycloak reaches avideo at
  # 127.0.0.1:443. After recreating avideo, recreate keycloak too.
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.0}
    command: start-dev --import-realm
    restart: "unless-stopped"
    network_mode: "service:avideo"
    depends_on:
      avideo:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}"
      # Becomes the issuer. Must equal the address the browser uses.
      KC_HOSTNAME: "${KEYCLOAK_URL:?set KEYCLOAK_URL}"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "${KEYCLOAK_PORT:-8081}"
      # values for the ${...} placeholders in the realm definition
      AVIDEO_BASE_URL: "${AVIDEO_BASE_URL:?set AVIDEO_BASE_URL}"
      # Where back-channel logout notices go: a URL that reaches AVideo from the Keycloak container.
      # http by default. AVideo's certificate is self-signed, and Keycloak fails to verify it over https.
      AVIDEO_BACKCHANNEL_BASE_URL: "${AVIDEO_BACKCHANNEL_BASE_URL:-http://${SERVER_NAME}}"
    volumes:
      - "${LOGINOIDC_REPO}/dev/keycloak/realm-loginoidc-test.json:/opt/keycloak/data/import/realm-loginoidc-test.json:ro"

volumes:
  avideo_db:
  avideo_db_encoder:
